name: ThatMovieNightLife
options:
  bundleIdPrefix: com.aw
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  TMNLRoomActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/TMNLActivityShared
      - path: App/TMNLActivityWidget
      - path: Sources/TMNLCore/PersistentRoom.swift
      - path: Sources/TMNLCore/CloudRoomRecord.swift
      - path: Sources/TMNLCore/CloudRoomClient.swift
      - path: Sources/TMNLCore/RoomCompanionState.swift
      - path: Sources/TMNLCore/RoomLinks.swift
      - path: Sources/TMNLCore/PublicMovieList.swift
    info:
      path: App/TMNLActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Movie Night
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TMNLCloudKitContainerIdentifier: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aw.ThatMovieNightLifeIOS.RoomActivity
        CODE_SIGN_ENTITLEMENTS: App/TMNLActivityWidget/TMNLRoomActivity.entitlements
        TMNLCloudKitEnvironment: Development
        DEVELOPMENT_TEAM: WN52T2UJ4W
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TMNL Room Activity App Store
          TMNLCloudKitEnvironment: Production
  ThatMovieNightLifeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/ThatMovieNightLifeMac
      - path: App/TMNLShared/AppTheme.swift
      - path: App/TMNLShared/RoomsTabView.swift
      - path: App/TMNLShared/LocalRoomsStore.swift
      - path: App/TMNLShared/RoomSharePlay.swift
      - path: App/TMNLShared/PublicListsView.swift
      - path: Sources/TMNLCore
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: That Movie Night Life
        PRODUCT_BUNDLE_IDENTIFIER: com.aw.ThatMovieNightLifeMac
        PRODUCT_NAME: That Movie Night Life
        ENABLE_APP_SANDBOX: YES
  ThatMovieNightLifeTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/TMNLShared
        excludes:
          - RootTabView.swift
          - TonightTabView.swift
          - EncoreTabView.swift
          - LibraryTabView.swift
          - FeatureTabView.swift
          - StartNightSheet.swift
      - path: App/ThatMovieNightLifeTV
      - path: Sources/TMNLCore
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_CFBundleDisplayName: That Movie Night Life
        INFOPLIST_KEY_LSRequiresIPhoneOS: false
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_TMDBReadAccessToken: ""
        INFOPLIST_KEY_TMDBRegion: US
        PRODUCT_BUNDLE_IDENTIFIER: com.aw.ThatMovieNightLifeTV
        PRODUCT_NAME: That Movie Night Life
        TARGETED_DEVICE_FAMILY: 3
  ThatMovieNightLifeIOS:
    type: application
    info:
      path: App/ThatMovieNightLifeIOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CKSharingSupported: true
        NSSupportsLiveActivities: true
        TMNLCloudKitContainerIdentifier: ""
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/TMNLShared
      - path: App/ThatMovieNightLifeIOS
      - path: App/TMNLActivityShared
      - path: Sources/TMNLCore
    dependencies:
      - package: ZIPFoundation
      - target: TMNLRoomActivity
        embed: true
    settings:
      base:
        INFOPLIST_KEY_CKSharingSupported: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_TMNLCloudKitContainerIdentifier: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: WN52T2UJ4W
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: That Movie Night Life
        INFOPLIST_KEY_TMDBReadAccessToken: ""
        INFOPLIST_KEY_TMDBRegion: US
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        PRODUCT_BUNDLE_IDENTIFIER: com.aw.ThatMovieNightLifeIOS
        CODE_SIGN_ENTITLEMENTS: App/ThatMovieNightLifeIOS/ThatMovieNightLifeIOS.entitlements
        TMNLCloudKitEnvironment: Development
        PRODUCT_NAME: That Movie Night Life
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TMNL iOS App Store
          TMNLCloudKitEnvironment: Production
schemes:
  ThatMovieNightLifeMac:
    build:
      targets:
        ThatMovieNightLifeMac: all
    run:
      config: Debug
  ThatMovieNightLifeTV:
    build:
      targets:
        ThatMovieNightLifeTV: all
    run:
      config: Debug
  ThatMovieNightLifeIOS:
    build:
      targets:
        ThatMovieNightLifeIOS: all
    run:
      config: Debug
